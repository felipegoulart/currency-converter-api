name: Currency Converter

on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test # Aqui o GitHub trava se o teste falhar

